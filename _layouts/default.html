<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="DATAMIND Catalogue home">
        <span class="brand-mark" aria-hidden="true">D</span>
        <span><strong>DATAMIND</strong><small>Resource Catalogue</small></span>
      </a>
      <nav aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}">Catalogue</a>
        <a href="https://datamind.org.uk/">DATAMIND website</a>
        <a href="https://github.com/DATAMIND-UK/catalogue">GitHub</a>
      </nav>
    </div>
  </header>
  <main id="main-content" class="wrap">{{ content }}</main>
  <footer class="site-footer"><div class="wrap">Better mental health through data-driven research. A project of <a href="https://datamind.org.uk/">DATAMIND</a>.</div></footer>
</body>
</html>
