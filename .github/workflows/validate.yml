name: Validate catalogue
on:
  pull_request:
    paths:
      - "_data-resources/**"
      - "_software/**"
      - "_data-pipelines/**"
      - "scripts/validate_catalogue.rb"
      - "_config.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalogue entries
        run: ruby scripts/validate_catalogue.rb
